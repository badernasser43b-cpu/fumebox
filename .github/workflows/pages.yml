# Publishes the site/ folder to GitHub Pages on every push to main.
name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish a service_role / secret key
        shell: python
        run: |
          import base64, json, pathlib, re, sys
          bad = []
          for f in pathlib.Path("site").rglob("*"):
              if not f.is_file() or f.suffix not in {".js", ".html", ".json"} or "vendor" in f.parts:
                  continue
              text = f.read_text(errors="ignore")
              if re.search(r"sb_secret_[A-Za-z0-9_-]{10,}", text):
                  bad.append(str(f))
              for tok in re.findall(r"eyJ[A-Za-z0-9_-]+\.(eyJ[A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+", text):
                  payload = json.loads(base64.urlsafe_b64decode(tok + "=" * (-len(tok) % 4)))
                  if payload.get("role") == "service_role":
                      bad.append(str(f))
          if bad:
              print("::error::A secret Supabase key was found in: " + ", ".join(bad)); sys.exit(1)
          print("No secret keys in site/")
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

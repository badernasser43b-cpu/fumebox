# Keeps the free Supabase project from being paused for inactivity
# (Supabase pauses Free-plan projects with too little database activity over 7 days).
# Runs daily and can be started by hand from the Actions tab.
# Requires two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 * * *'   # every day 03:17 UTC (07:17 UAE)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the public API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets"; exit 1
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.txt -w '%{http_code}' -X POST "${SUPABASE_URL}/rest/v1/rpc/ping" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" -d '{}' || echo 000)
            echo "attempt ${attempt}: HTTP ${code} $(cat body.txt 2>/dev/null)"
            if [ "${code}" = "200" ]; then exit 0; fi
            sleep $((attempt * 20))
          done
          echo "::error::Supabase did not respond. The project may be paused: open the Supabase dashboard and click Resume project."
          exit 1

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Store admin — FUMEBOX</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/vendor/supabase.js" defer></script>
  <script type="module" src="js/admin.js"></script>
</head>
<body data-page="admin" class="admin">
  <div id="loginView" class="login" hidden>
    <form class="panel" id="loginForm" novalidate>
      <a class="brand" href="index.html"><span>FUMEBOX</span></a>
      <h1 style="font-size:2rem">Store admin</h1>
      <p class="muted small">Sign in with the administrator account created in Supabase. There is no public sign-up.</p>
      <div id="loginError" class="form-error" role="alert" hidden></div>
      <div class="field"><label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-block btn-ink" type="submit" id="loginBtn">Sign in</button>
      <p class="small"><a href="index.html">Back to the store</a></p>
    </form>
  </div>

  <div id="appView" class="admin-app" hidden>
    <aside class="admin-side">
      <a class="brand" href="index.html" title="Open the store"><span>FUMEBOX</span></a>
      <nav aria-label="Admin sections" id="tabs">
        <button type="button" data-tab="overview" aria-current="page">Overview</button>
        <button type="button" data-tab="items">Items &amp; stock</button>
        <button type="button" data-tab="boxes">Themed boxes</button>
        <button type="button" data-tab="orders">Orders <span class="pill" id="newOrders" hidden></span></button>
        <button type="button" data-tab="messages">Messages <span class="pill" id="newMsgs" hidden></span></button>
        <button type="button" data-tab="analytics">Analytics</button>
        <button type="button" data-tab="content">Site content</button>
      </nav>
      <div class="side-foot">
        <span class="small" id="whoami"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="logout">Sign out</button>
      </div>
    </aside>
    <main class="admin-main" id="view" tabindex="-1"></main>
  </div>

  <dialog class="sheet admin-dialog" id="editor"></dialog>
  <dialog class="sheet confirm-dialog" id="confirmDlg">
    <form method="dialog" class="info" style="padding:1.5rem">
      <h2 id="confirmTitle" style="font-size:1.4rem"></h2>
      <p id="confirmText" class="muted"></p>
      <div class="hero-actions"><button class="btn btn-ink" value="ok" id="confirmOk">Confirm</button><button class="btn btn-ghost" value="cancel">Cancel</button></div>
    </form>
  </dialog>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Shop perfumes and gift sets — FUMEBOX</title>
  <meta name="description" content="Shop women's and men's perfumes and FUMEBOX gift sets.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/vendor/supabase.js" defer></script>
  <script type="module" src="js/pages/shop.js"></script>
</head>
<body data-page="shop">
<main>
  <div class="wrap page-head">
    <h1>Shop</h1>
    <p class="lead">Start with a gift set, or browse every perfume and put together a gift box of your own.</p>
  </div>

  <section class="wrap section-tight" aria-labelledby="boxesTitle">
    <h2 id="boxesTitle">Signature boxes</h2>
    <div class="boxes-grid" id="boxesGrid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="wrap section-tight" id="items" aria-labelledby="itemsTitle">
    <div class="section-head">
      <div><h2 id="itemsTitle">All perfumes</h2><p class="muted">Add any 3 to 8 perfumes to your own gift box. <a href="builder.html">Open the box builder</a></p></div>
    </div>
    <div class="toolbar">
      <label class="search"><span class="sr">Search items</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Search perfumes, e.g. Chanel" autocomplete="off">
      </label>
      <label><span class="sr">Category</span><select id="category"><option value="">All categories</option></select></label>
      <label><span class="sr">Sort</span><select id="sort">
        <option value="featured">Featured first</option><option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option><option value="name">Name A–Z</option></select></label>
    </div>
    <div class="chip-row" id="moodChips" role="group" aria-label="Filter by section" style="margin-bottom:1rem"></div>
    <p class="result-count" id="count" aria-live="polite"></p>
    <div class="items-grid" id="itemsGrid"></div>
  </section>
</main>
</body>
</html>
